<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Blocked - ContentGuard AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            color: #dc2626;
            margin: 0 0 16px 0;
            font-size: 32px;
        }
        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .details {
            background: #f3f4f6;
            border-radius: 8px;
            padding: 16px;
            margin: 24px 0;
            text-align: left;
        }
        .details strong {
            display: block;
            color: #374151;
            margin-bottom: 8px;
        }
        .category {
            display: inline-block;
            background: #dc2626;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            margin: 4px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 8px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .button:hover {
            background: #5568d3;
        }
        .button.secondary {
            background: #6b7280;
        }
        .button.secondary:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛡️</div>
        <h1>Content Blocked</h1>
        <p>This page has been blocked by ContentGuard AI based on your active content policy.</p>
        
        <div class="details" id="details">
            <strong>Blocked Categories:</strong>
            <div id="categories"></div>
        </div>
        
        <p style="font-size: 14px;">You can adjust your content filtering policies in the ContentGuard dashboard.</p>
        
        <button class="button" onclick="openDashboard()">Open Dashboard</button>
        <button class="button secondary" onclick="goBack()">Go Back</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const blockedUrl = params.get('url');
        const categories = params.get('categories');
        
        if (categories) {
            const categoryList = categories.split(',');
            const container = document.getElementById('categories');
            categoryList.forEach(cat => {
                const badge = document.createElement('span');
                badge.className = 'category';
                badge.textContent = cat.replace('_', ' ').toUpperCase();
                container.appendChild(badge);
            });
        }
        
        function openDashboard() {
            window.location.href = 'chrome-extension://' + chrome.runtime.id + '/popup.html';
        }
        
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
