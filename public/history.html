<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Sentinel - History Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      color: #667eea;
      margin-bottom: 10px;
    }

    .controls {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .control-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-weight: 500;
      color: #555;
    }

    input, select {
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #5a6fd8;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .history-table {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #667eea;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 500;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    tr:hover {
      background: #f8f9ff;
    }

    .type-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .type-image {
      background: #e3f2fd;
      color: #1976d2;
    }

    .type-text {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .result-preview {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cost {
      font-weight: 500;
      color: #4caf50;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }

    .pagination button:hover {
      background: #f5f5f5;
    }

    .pagination button.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Access Sentinel - History Dashboard</h1>
      <p>Track your AI analyses and fact-checks with detailed insights and usage patterns</p>
    </div>

    <div class="controls">
      <div class="control-row">
        <div class="control-group">
          <label for="searchInput">Search</label>
          <input type="text" id="searchInput" placeholder="Search analyses...">
        </div>
        <div class="control-group">
          <label for="typeFilter">Type</label>
          <select id="typeFilter">
            <option value="">All Types</option>
            <option value="image">Image Analysis</option>
            <option value="text">Fact Check</option>
          </select>
        </div>
        <div class="control-group">
          <label for="dateFrom">From Date</label>
          <input type="date" id="dateFrom">
        </div>
        <div class="control-group">
          <label for="dateTo">To Date</label>
          <input type="date" id="dateTo">
        </div>
        <div class="control-group">
          <label>&nbsp;</label>
          <button id="exportBtn" class="btn btn-secondary">Export CSV</button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalAnalyses">0</div>
        <div class="stat-label">Total Analyses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="imageAnalyses">0</div>
        <div class="stat-label">Image Analyses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="factChecks">0</div>
        <div class="stat-label">Fact Checks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalCost">$0.00</div>
        <div class="stat-label">Total Cost</div>
      </div>
    </div>

    <div class="history-table">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Source</th>
            <th>Result</th>
            <th>Cost</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr>
            <td colspan="6" class="empty-state">
              No analysis history found. Start using the extension to see your data here.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <script src="history.js"></script>
</body>
</html>
