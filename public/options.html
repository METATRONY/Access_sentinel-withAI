<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Sentinel - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
    }

    .header p {
      opacity: 0.8;
      margin: 0;
    }

    .section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .section h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toggle-group:last-child {
      border-bottom: none;
    }

    .toggle {
      width: 50px;
      height: 25px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle.active {
      background: #4CAF50;
    }

    .toggle::before {
      content: '';
      position: absolute;
      width: 21px;
      height: 21px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: all 0.3s ease;
    }

    .toggle.active::before {
      left: 27px;
    }

    select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
    }

    select option {
      background: #333;
      color: white;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: #4CAF50;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .actions {
      text-align: center;
      margin-top: 30px;
    }

    .actions .btn {
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Access Sentinel Settings</h1>
      <p>Configure your content filtering preferences</p>
    </div>

    <div class="section">
      <h2>Content Categories</h2>
      <div class="toggle-group">
        <label>Adult Content</label>
        <div class="toggle active" data-category="adult"></div>
      </div>
      <div class="toggle-group">
        <label>Violence & Gore</label>
        <div class="toggle active" data-category="violence"></div>
      </div>
      <div class="toggle-group">
        <label>Drugs & Substances</label>
        <div class="toggle active" data-category="drugs"></div>
      </div>
      <div class="toggle-group">
        <label>Gambling</label>
        <div class="toggle" data-category="gambling"></div>
      </div>
    </div>

    <div class="section">
      <h2>Sensitivity Level</h2>
      <div class="setting-group">
        <label for="blockLevel">Detection Sensitivity</label>
        <select id="blockLevel">
          <option value="low">Low - Only block obvious content</option>
          <option value="medium" selected>Medium - Balanced filtering</option>
          <option value="high">High - Strict filtering</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2>Advanced Options</h2>
      <div class="toggle-group">
        <label>Show blocked content notifications</label>
        <div class="toggle active" data-setting="showNotifications"></div>
      </div>
      <div class="toggle-group">
        <label>Allow manual content review</label>
        <div class="toggle active" data-setting="allowReview"></div>
      </div>
      <div class="toggle-group">
        <label>Collect anonymous usage statistics</label>
        <div class="toggle" data-setting="collectStats"></div>
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn btn-primary">Save Settings</button>
      <button id="resetBtn" class="btn">Reset to Defaults</button>
      <button id="dashboardBtn" class="btn">Open Dashboard</button>
    </div>
  </div>

  <script>
    class OptionsManager {
      constructor() {
        this.init();
      }

      async init() {
        await this.loadSettings();
        this.setupEventListeners();
      }

      async loadSettings() {
        const result = await chrome.storage.local.get(['settings']);
        const settings = result.settings || this.getDefaultSettings();
        this.applySettings(settings);
      }

      getDefaultSettings() {
        return {
          blockLevel: 'medium',
          categories: {
            adult: true,
            violence: true,
            drugs: true,
            gambling: false
          },
          showNotifications: true,
          allowReview: true,
          collectStats: false
        };
      }

      applySettings(settings) {
        document.getElementById('blockLevel').value = settings.blockLevel;
        
        Object.entries(settings.categories).forEach(([category, enabled]) => {
          const toggle = document.querySelector(`[data-category="${category}"]`);
          if (toggle) {
            toggle.classList.toggle('active', enabled);
          }
        });

        ['showNotifications', 'allowReview', 'collectStats'].forEach(setting => {
          const toggle = document.querySelector(`[data-setting="${setting}"]`);
          if (toggle) {
            toggle.classList.toggle('active', settings[setting]);
          }
        });
      }

      setupEventListeners() {
        document.querySelectorAll('.toggle').forEach(toggle => {
          toggle.addEventListener('click', () => {
            toggle.classList.toggle('active');
          });
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
          this.saveSettings();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
          this.resetSettings();
        });

        document.getElementById('dashboardBtn').addEventListener('click', () => {
          chrome.tabs.create({ url: 'https://access-sentinel.vercel.app' });
        });
      }

      async saveSettings() {
        const settings = {
          blockLevel: document.getElementById('blockLevel').value,
          categories: {},
          showNotifications: document.querySelector('[data-setting="showNotifications"]').classList.contains('active'),
          allowReview: document.querySelector('[data-setting="allowReview"]').classList.contains('active'),
          collectStats: document.querySelector('[data-setting="collectStats"]').classList.contains('active')
        };

        ['adult', 'violence', 'drugs', 'gambling'].forEach(category => {
          const toggle = document.querySelector(`[data-category="${category}"]`);
          settings.categories[category] = toggle.classList.contains('active');
        });

        await chrome.storage.local.set({ settings });
        
        // Notify background script
        chrome.runtime.sendMessage({
          action: 'updateSettings',
          settings: settings
        });

        alert('Settings saved successfully!');
      }

      async resetSettings() {
        if (confirm('Are you sure you want to reset all settings to defaults?')) {
          const defaultSettings = this.getDefaultSettings();
          this.applySettings(defaultSettings);
          await chrome.storage.local.set({ settings: defaultSettings });
          alert('Settings reset to defaults!');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new OptionsManager();
    });
  </script>
</body>
</html>
