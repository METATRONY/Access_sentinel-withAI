<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Sentinel</title>
  <link rel="stylesheet" href="content.css">
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .logo-icon {
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }
    
    .subtitle {
      font-size: 12px;
      opacity: 0.8;
      margin: 0;
    }
    
    .content {
      padding: 20px;
    }
    
    .auth-required {
      text-align: center;
      padding: 20px 0;
    }
    
    .auth-required h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    
    .auth-required p {
      margin: 0 0 16px 0;
      font-size: 14px;
      opacity: 0.8;
    }
    .auth-tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: rgba(255, 255, 255, 0.2);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      opacity: 0.9;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Main Container */
    #mainContainer {
      display: none;
    }

    .user-info {
      text-align: center;
      margin-bottom: 20px;
      font-size: 12px;
      opacity: 0.8;
    }

    .status-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }

    .toggle {
      width: 50px;
      height: 25px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle.active {
      background: #4CAF50;
    }

    .toggle::before {
      content: '';
      position: absolute;
      width: 21px;
      height: 21px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: all 0.3s ease;
    }

    .toggle.active::before {
      left: 27px;
    }

    .scan-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .scan-section h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }

    .result-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .category {
      width: 80px;
      text-transform: capitalize;
    }

    .score-bar {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      margin: 0 10px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .score-fill.low {
      background: #4CAF50;
    }

    .score-fill.medium {
      background: #FF9800;
    }

    .score-fill.high {
      background: #F44336;
    }

    .score {
      width: 35px;
      text-align: right;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-small {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-small:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛡️ Access Sentinel</div>
      <div class="subtitle">Content Protection Extension</div>
    </div>
    <!-- Authentication Container -->
    <div id="authContainer" class="content">
      <div class="auth-tabs" style="display: flex; gap: 10px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 4px;">
        <div class="auth-tab active" data-tab="login">Login</div>
        <div class="auth-tab" data-tab="signup">Sign Up</div>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>
        <button id="loginBtn" class="btn">Login</button>
      </div>

      <div id="signupForm" style="display: none;">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password">
        </div>
        <button id="signupBtn" class="btn">Sign Up</button>
      </div>
    </div>

    <!-- Main Interface -->
    <div id="mainContainer" class="content">
      <div id="userInfo" class="user-info">Not logged in</div>

      <div class="status-section">
        <h3>Extension Status</h3>
        <div class="toggle-container">
          <span>Disabled</span>
          <div id="enableToggle" class="toggle"></div>
          <span>Active</span>
        </div>
        <div id="status">Disabled</div>
      </div>

      <div class="scan-section">
        <h3>Page Analysis</h3>
        <div id="scanResults">
          <p>No scan results available</p>
        </div>
        <button id="scanBtn" class="btn-small">Scan Page</button>
      </div>

      <div class="actions">
        <button id="dashboardBtn" class="btn-small">Dashboard</button>
        <button id="logoutBtn" class="btn-small">Logout</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
